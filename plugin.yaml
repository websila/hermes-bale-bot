name: bale-platform
label: Bale
kind: platform
version: 1.0.0
description: >
  Bale messenger gateway adapter for Hermes Agent.
  Talks to the Telegram-compatible Bale Bot API (https://tapi.bale.ai/bot)
  so Telegram and Bale can run side-by-side on the same profile.
  Converts outbound text to Bale auto-Markdown and strips Telegram HTML
  from exec-approval / clarify prompts (Bale has no HTML parse_mode).
author: Websila
requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token from @botfather in Bale"
    prompt: "Bale bot token"
    url: "https://ble.ir/botfather"
    password: true
optional_env:
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: BALE_ALLOW_ALL_USERS
    description: "Allow any Bale user to trigger the bot (dev/personal only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: BALE_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
